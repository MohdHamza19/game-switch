<div class="advert-page">
  <div class="container py-4">
    <ng-container *ngIf="!loading; else loadingTpl">
      <ng-container *ngIf="!error; else errorTpl">
        <div class="row g-4">
          <!-- Main Content -->
          <div class="col-lg-8">
            <div class="gallery-wrapper">
              <widget-advert-carousel></widget-advert-carousel>
            </div>

            <div class="content-card mt-4">
              <div class="d-flex justify-content-between align-items-start">
                <h1 class="game-title">{{card.title}}</h1>
              </div>
              
              <div class="specs-grid">
                <div class="spec-item" *ngFor="let spec of [
                  {icon: 'controller', label: 'Platform', value: card.platform},
                  {icon: 'box', label: 'Box Included', value: card.includesBox},
                  {icon: 'tag', label: 'For Sale', value: card.openToSale},
                  {icon: 'nintendo-switch', label: 'Compatible', value: card.playableOn},
                  {icon: 'patch-check', label: 'Condition', value: card.condition}
                ]">
                  <i class="bi bi-{{spec.icon}}"></i>
                  <div>
                    <span class="label">{{spec.label}}</span>
                    <span class="value">{{spec.value}}</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="content-card mt-4">
              <h2>Description</h2>
              <p class="description">{{card.description}}</p>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="col-lg-4">
            <div class="seller-card">
              <div class="seller-info">
                <div class="avatar">
                  <i class="bi bi-person"></i>
                </div>
                <div>
                  <h3>{{card.sellerName || 'User9876'}}</h3>
                  <span class="member-since">Member since {{formatDate(card.joinDate || '2024-01-01')}}</span>
                </div>
              </div>

              <button class="contact-btn" (click)="togglePhone()">
                <i class="bi bi-telephone"></i>
                {{isPhoneVisible ? card.phone || '9876543210' : 'Show Contact'}}
              </button>

              <div class="location-info">
                <div><i class="bi bi-geo-alt"></i> {{card.location}}</div>
                <div><i class="bi bi-calendar3"></i> Posted {{formatDate(card.date)}}</div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="loading-state">
    <div class="spinner-border text-purple"></div>
  </div>
</ng-template>

<ng-template #errorTpl>
  <div class="error-state">
    <i class="bi bi-exclamation-circle"></i>
    <p>{{error}}</p>
  </div>
</ng-template>
