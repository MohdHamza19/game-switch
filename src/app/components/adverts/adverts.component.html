<div class="adverts-container">
  <!-- Filters Section -->
  <div class="filters-section" [class.collapsed]="isFilterCollapsed">
    <div class="filters-header d-flex justify-content-between align-items-center p-3" (click)="toggleFilters()">
      <h5 class="m-0">Filters</h5>
      <i class="bi" [class.bi-chevron-up]="!isFilterCollapsed" [class.bi-chevron-down]="isFilterCollapsed"></i>
    </div>
    
    <div class="filters-body" [class.show]="!isFilterCollapsed">
      <div class="search-box p-3">
      <h5>Find your <span class="text--purple">next</span> game</h5>
        <label class="form-label">Search Games</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" 
                 [(ngModel)]="searchInput"
                 (focus)="onInputFocus($event)" 
                 (input)="onInputFocus($event)" 
                 (blur)="onInputBlur()"
                 (blur)="searchInput = ''"
                 placeholder="Enter game title...">
        </div>
        <div class="search-suggestions" *ngIf="games && games.length > 0 && isSearchInputFocused">
          <div class="spinner-border text-light" *ngIf="loadingGames"></div>
          <div class="suggestion-item" *ngFor="let game of games" (click)="selectGame(game)">
            {{ game.title }}
          </div>
        </div>
      </div>

      <div class="filter-group p-3">
        <label class="form-label">Platform</label>
        <div class="platform-chips">
          <div class="chip" *ngFor="let platform of platforms" 
               [class.active]="selectedPlatform === platform.value"
               (click)="selectPlatform(platform.value)">
            <i [class]="platform.icon"></i>
            {{ platform.name }}
          </div>
        </div>
      </div>

      <div class="filter-group p-3">
        <label class="form-label">Location</label>
        <select class="form-select" [(ngModel)]="selectedLocation" (change)="selectLocation(selectedLocation)">
          <option value="">Any Location</option>
          <option *ngFor="let location of locations" [value]="location">
            {{ location }}
          </option>
        </select>
      </div>

      <div class="p-3">
        <button class="btn text--white filter-btn background--purple w-100" (click)="applyFilters()">
          Apply Filters
        </button>
      </div>
    </div>
  </div>

  <!-- Results Section -->
  <div class="results-section">
    <widget-advert-card [cards]="cards" (idEmitter)="viewAdvert($event)"></widget-advert-card>
  </div>
</div>
<widget-login-modal></widget-login-modal>
