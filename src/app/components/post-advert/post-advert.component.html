<div class="block--dark">
    <div class="container">
        <div class="block--light-gray">
            <header>
                <h2 class="header__title">Post Your Game</h2>
                <form [formGroup]="advertForm" (ngSubmit)="onSubmit()">
                    <div class="form--input">
                        <label for="title">Game Title*</label>
                        <input type="text" id="title" formControlName="title" 
                            placeholder="Enter the game title"
                            class="form-control bg-dark text-light border-dark">
                    </div>

                    <div class="form__description form--input">
                        <label for="description">Description*</label>
                        <textarea id="description" formControlName="description" 
                            placeholder="Describe the condition, features and other details of your game"
                            class="form-control bg-dark text-light border-dark"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form--input">
                                <label for="location">City*</label>
                                <input type="text" id="location" formControlName="location"
                                    placeholder="Enter your city"
                                    class="form-control bg-dark text-light border-dark">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form--input">
                                <label for="area">Area*</label>
                                <input type="text" id="area" formControlName="area"
                                    placeholder="Enter your area"
                                    class="form-control bg-dark text-light border-dark">
                            </div>
                        </div>
                    </div>

                    <!-- Dropdown sections -->
                    <div class="row">
                        <div class="col-md-6" *ngFor="let element of ['platform', 'model', 'condition', 'box', 'sale']">
                            <div class="form--input">
                                <label for="{{ element }}">
                                    {{ element === 'box' ? 'Box Included?' : 
                                       element === 'sale' ? 'For Sale?' : 
                                       (element | titlecase) }}*
                                </label>
                                <div class="input--wrapper" #selectElement [attr.id]="element">
                                    <input type="text" (focus)="onInputFocus(element)" 
                                           (blur)="onInputBlur(element)"
                                           readonly
                                           [placeholder]="'Select ' + (element | titlecase)"
                                           class="form-control bg-dark text-light border-dark input--search cursor-pointer"
                                           [value]="dropdownOptions[element]">
                                    <span class="condition-arrow"><i class="bi bi-chevron-down"></i></span>
                                    <span class="input--conditions">
                                        <div class="cursor-pointer">
                                            <p *ngFor="let option of this[element]" 
                                               (click)="selectCondition(element, option)">
                                                {{ option }}
                                            </p>
                                        </div>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap mt-4 align-items-center">
                        <button type="submit" class="btn btn-purple">Post Advertisement</button>
                        <div class="error-indicator" *ngIf="showError">
                            <i class="bi bi-exclamation-circle"></i>
                            <span class="ml-2">Please fill all required fields</span>
                        </div>
                    </div>
                </form>
            </header>
        </div>
    </div>
</div>
