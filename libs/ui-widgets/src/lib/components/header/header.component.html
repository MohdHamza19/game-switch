<nav class="navbar">
  <ul>
    <li class="navbar-logo" routerLink="/">
      <img src="assets/images/GameSwitch.png" alt="GameSwitch Logo" />
    </li>
    <ng-container *ngIf="isLoggedIn">
      <ul class="navbar-list">
        <li class="navbar-toggle" (click)="toggleActive()">
          <i class="bi bi-list"></i>
        </li>
        <ng-container id="navbarToggleExternalContent">
          <li class="navbar-link" [ngClass]="{ active: isActive }">
            <a routerLink="/">Home</a>
          </li>
          <li class="navbar-link" [ngClass]="{ active: isActive }">
            <a routerLink="/home">Adverts</a>
          </li>
          <li class="navbar-link" [ngClass]="{ active: isActive }">
            <a routerLink="/post">Post</a>
          </li>
        </ng-container>
      </ul>
    </ng-container>
    <li class="login-icon" (click)="login()">
      <i class="bi bi-person-circle"></i>
    </li>
  </ul>
</nav>
