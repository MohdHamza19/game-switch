<div class="container-fluid p-4">
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
        <div class="col" *ngFor="let card of cards()">
            <div class="card h-100" (click)="viewAd(card.id)">
                <div class="card-img-wrapper">
                    <img [src]="getImageUrl(card.image)" [alt]="card.title">
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{card.title}}</h5>
                    <p class="card-text mb-2"><i class="bi bi-geo-alt"></i> {{card.location}}</p>
                    <p class="card-text"><small>Condition: {{card.condition}}</small></p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="price"></span>
                        <button class="btn view-btn">View</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Loading skeleton -->
        <ng-container *ngIf="isLoading()">
            <div class="col" *ngFor="let i of [1,2,3,4,5,6,7,8]">
                <div class="card h-100">
                    <div class="card-img-wrapper skeleton"></div>
                    <div class="card-body">
                        <div class="skeleton skeleton-text skeleton--large"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="d-flex justify-content-between mt-3">
                            <div></div>
                            <div class="skeleton skeleton-text w-25"></div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</div>
